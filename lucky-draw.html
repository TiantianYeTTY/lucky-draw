<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff3e6">
<title>老虎机抽奖 · Lucky Draw</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127920;</text></svg>">
<style>
:root {
  --primary: #e0263c;
  --primary-dark: #b01228;
  --primary-soft: #ffeee8;
  --ink: #38201a;
  --muted: #9a7264;
  --line: #f2e0d4;
  --cell-h: clamp(84px, 24vw, 128px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, #ffd9b8 0%, rgba(255,217,184,0) 60%),
    linear-gradient(180deg, #fff3e6 0%, #fffaf4 100%);
  min-height: 100vh;
}
.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 16px 24px;
}
.machine {
  width: min(760px, calc(100vw - 32px));
  background: #ffffff;
  border-radius: 32px;
  padding: 26px 28px 24px;
  box-shadow: 0 30px 80px rgba(30, 80, 160, .16), 0 2px 6px rgba(30, 80, 160, .08);
}
.brand { text-align: center; }
.brand-dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 10px; }
.brand-dots span { width: 10px; height: 10px; border-radius: 50%; }
.brand-dots span:nth-child(1) { background: #ff3b30; }
.brand-dots span:nth-child(2) { background: #ff9500; }
.brand-dots span:nth-child(3) { background: #ffcc00; }
.brand h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: .18em;
  background: linear-gradient(90deg, #d70015, #ff9500);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand p { margin-top: 4px; color: var(--muted); font-size: 13px; letter-spacing: .06em; }
.deck {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 24px;
}
.windows {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: clamp(10px, 2.4vw, 16px);
}
.reel {
  position: relative;
  width: clamp(72px, 21vw, 128px);
  height: var(--cell-h);
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(180deg, #4a0d18 0%, #2e060e 55%, #4a0d18 100%);
  box-shadow:
    inset 0 2px 12px rgba(0, 0, 0, .55),
    0 0 0 3px #ffffff,
    0 0 0 5px var(--line),
    0 12px 26px rgba(160, 60, 20, .16);
  transition: box-shadow .3s;
}
.reel.lit {
  box-shadow:
    inset 0 2px 12px rgba(0, 0, 0, .5),
    0 0 0 3px #ffffff,
    0 0 0 5px var(--primary),
    0 0 28px rgba(255, 149, 0, .5);
}
.reel::before, .reel::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 26%;
  z-index: 2;
  pointer-events: none;
}
.reel::before { top: 0; background: linear-gradient(180deg, rgba(5, 12, 26, .85), rgba(5, 12, 26, 0)); }
.reel::after { bottom: 0; background: linear-gradient(0deg, rgba(5, 12, 26, .85), rgba(5, 12, 26, 0)); }
.strip { will-change: transform; }
.cell {
  height: var(--cell-h);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--cell-h) * .56);
  font-weight: 800;
  color: #ffd968;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 18px rgba(255, 160, 60, .45);
}
.lever {
  position: relative;
  width: 92px;
  height: 250px;
  flex: none;
  cursor: pointer;
  perspective: 700px;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.lever.disabled { pointer-events: none; opacity: .75; }
.lever-hub {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff, #dfe9f5 45%, #b9cbe2 100%);
  box-shadow: inset 0 -3px 6px rgba(90, 120, 160, .35), 0 6px 14px rgba(30, 80, 160, .25);
}
.lever-hub::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 30%, #ff9d8a, #e0263c 70%);
}
.lever-arm {
  position: absolute;
  left: 50%;
  bottom: 32px;
  width: 12px;
  height: 158px;
  margin-left: -6px;
  transform-origin: 50% 100%;
  border-radius: 8px;
  background: linear-gradient(90deg, #9fb2c9, #eef4fb 45%, #8fa5bf);
  box-shadow: 0 4px 10px rgba(30, 80, 160, .25);
}
.lever-knob {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #ffb37c, #ff4a2e 55%, #b31316 100%);
  box-shadow: 0 8px 18px rgba(220, 60, 20, .4), inset 0 -4px 8px rgba(140, 20, 10, .35);
  transition: filter .2s;
}
.lever:hover .lever-knob { filter: brightness(1.08); }
.lever.pulling .lever-arm { animation: leverPull .58s cubic-bezier(.36, 1.4, .42, 1); }
@keyframes leverPull {
  0% { transform: rotateX(0deg); }
  40% { transform: rotateX(-138deg); }
  62% { transform: rotateX(-126deg); }
  100% { transform: rotateX(0deg); }
}
.result-bar {
  margin-top: 22px;
  text-align: center;
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--primary-soft);
  color: var(--primary-dark);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: .04em;
}
.result-bar.win {
  background: linear-gradient(90deg, #e0263c, #ff9500);
  color: #ffffff;
  font-size: 24px;
  letter-spacing: .1em;
  box-shadow: 0 10px 24px rgba(224, 38, 60, .35);
  animation: pop .45s cubic-bezier(.3, 1.6, .4, 1);
}
@keyframes pop {
  0% { transform: scale(.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.panel {
  margin-top: 20px;
  background: #fdf5ee;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 18px 14px;
  display: grid;
  grid-template-columns: repeat(4, auto);
  gap: 12px 26px;
  align-items: end;
  justify-content: center;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: .04em;
}
.field input {
  width: 92px;
  padding: 9px 8px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: #ffffff;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  text-align: center;
  outline: none;
  font-family: inherit;
}
.field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(224, 38, 60, .16); }
.field input.invalid { border-color: #ff3b30; box-shadow: 0 0 0 3px rgba(255, 59, 48, .15); }
.switch {
  width: 52px;
  height: 32px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  background: #ecd9cd;
  position: relative;
  transition: background .25s;
  padding: 0;
  display: block;
}
.switch .knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(160, 60, 30, .28);
  transition: left .25s cubic-bezier(.3, 1.3, .5, 1);
}
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"] .knob { left: 22px; }
.ghost-btn {
  height: 42px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: #ffffff;
  color: var(--primary-dark);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: border-color .2s, color .2s;
}
.ghost-btn:hover { border-color: var(--primary); color: var(--primary); }
.pool-info { text-align: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
.history { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 14px; }
.history-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; }
.chip {
  padding: 5px 13px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary-dark);
  font-weight: 800;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  font-family: inherit;
  cursor: pointer;
  border: none;
  transition: transform .15s;
}
.chip:hover { transform: translateY(-1px); }
.chip.latest {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(224, 38, 60, .35);
}
.chips .empty { color: #c9ac9e; font-size: 13px; }
.page-sign {
  text-align: center;
  margin-top: 26px;
  color: #b99a8a;
  font-size: 12px;
  letter-spacing: .08em;
}
.toast {
  position: fixed;
  top: 22px;
  left: 50%;
  transform: translate(-50%, -12px);
  background: rgba(70, 20, 12, .92);
  color: #ffffff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 99;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 560px) {
  .machine { padding: 20px 16px 18px; border-radius: 24px; }
  .deck { flex-direction: column; gap: 8px; }
  .lever { height: 196px; }
  .lever-arm { height: 122px; }
  .lever-knob { width: 44px; height: 44px; top: -26px; }
  .panel { grid-template-columns: 1fr 1fr; justify-items: start; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="machine">
    <header class="brand">
      <div class="brand-dots"><span></span><span></span><span></span></div>
      <h1>LUCKY DRAW</h1>
      <p>抽奖 · 编号 0 ~ 999</p>
    </header>
    <div class="deck">
      <div class="windows">
        <div class="reel" id="reel0"><div class="strip"></div></div>
        <div class="reel" id="reel1"><div class="strip"></div></div>
        <div class="reel" id="reel2"><div class="strip"></div></div>
      </div>
      <div class="lever" id="lever" title="点击拉杆开始抽奖">
        <div class="lever-arm" id="leverArm"><div class="lever-knob"></div></div>
        <div class="lever-hub"></div>
      </div>
    </div>
    <div class="result-bar" id="resultBar">点击拨杆开始抽奖</div>
    <div class="panel">
      <div class="field">
        <label for="startInput">起始编号</label>
        <input type="number" id="startInput" min="0" max="999" value="0" inputmode="numeric">
      </div>
      <div class="field">
        <label for="endInput">结束编号</label>
        <input type="number" id="endInput" min="0" max="999" value="999" inputmode="numeric">
      </div>
      <div class="field">
        <label id="noRepeatLabel">不重复抽取</label>
        <button class="switch" id="noRepeatSwitch" role="switch" aria-checked="false" aria-labelledby="noRepeatLabel"><span class="knob"></span></button>
      </div>
      <div class="field">
        <label for="resetBtn">记录</label>
        <button class="ghost-btn" id="resetBtn">重置记录</button>
      </div>
    </div>
    <p class="pool-info" id="poolInfo">编号池：0 ~ 999 · 共 1000 个编号</p>
    <div class="history">
      <div class="history-head">
        <span>开奖记录</span>
        <span id="historyCount">已抽 0 次</span>
      </div>
      <div class="chips" id="chips"><span class="empty">暂无记录</span></div>
    </div>
  </div>
  <footer class="page-sign">Designed by TiantianYe</footer>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const REPEAT = 22;
const RESET_GROUP = 3;
const TARGET_GROUP = 18;
const OVERSHOOT = 2;
const DURATIONS = [1400, 1950, 2500];
const DELAYS = [60, 420, 800];
const lever = document.getElementById('lever');
const leverArm = document.getElementById('leverArm');
const resultBar = document.getElementById('resultBar');
const startInput = document.getElementById('startInput');
const endInput = document.getElementById('endInput');
const noRepeatSwitch = document.getElementById('noRepeatSwitch');
const resetBtn = document.getElementById('resetBtn');
const poolInfo = document.getElementById('poolInfo');
const chips = document.getElementById('chips');
const historyCount = document.getElementById('historyCount');
const toast = document.getElementById('toast');
const reels = [0, 1, 2].map(function (i) {
  const el = document.getElementById('reel' + i);
  return { el: el, strip: el.querySelector('.strip'), cur: 0 };
});
let cellH = 120;
let rangeStart = 0;
let rangeEnd = 999;
let noRepeat = false;
let drawn = new Set();
let remaining = [];
let historyList = [];
let spinning = false;
let toastTimer = null;

function pad3(n) {
  return String(n).padStart(3, '0');
}

function randInt(min, max) {
  const range = max - min + 1;
  const limit = Math.floor(4294967296 / range) * range;
  const buf = new Uint32Array(1);
  let v;
  do {
    crypto.getRandomValues(buf);
    v = buf[0];
  } while (v >= limit);
  return min + (v % range);
}

function buildStrips() {
  reels.forEach(function (r) {
    r.strip.innerHTML = '';
    for (let g = 0; g < REPEAT; g++) {
      for (let d = 0; d <= 9; d++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = d;
        r.strip.appendChild(cell);
      }
    }
  });
}

function snapReel(r) {
  cellH = r.strip.firstElementChild.offsetHeight;
  r.strip.style.transition = 'none';
  r.strip.style.transform = 'translateY(' + (-(RESET_GROUP * 10 + r.cur) * cellH) + 'px)';
  r.strip.getBoundingClientRect();
}

function spinReel(index, target, duration, delay) {
  const r = reels[index];
  cellH = r.strip.firstElementChild.offsetHeight;
  const startPos = (RESET_GROUP * 10 + r.cur) * cellH;
  const overPos = (TARGET_GROUP * 10 + target + OVERSHOOT) * cellH;
  const endPos = (TARGET_GROUP * 10 + target) * cellH;
  const t1 = Math.round(duration * 0.82);
  const t2 = duration - t1;
  setTimeout(function () {
    r.strip.style.transition = 'none';
    r.strip.style.transform = 'translateY(' + (-startPos) + 'px)';
    r.strip.getBoundingClientRect();
    r.strip.style.transition = 'transform ' + t1 + 'ms cubic-bezier(.3,.6,.6,1)';
    r.strip.style.transform = 'translateY(' + (-overPos) + 'px)';
  }, delay);
  setTimeout(function () {
    r.strip.style.transition = 'transform ' + t2 + 'ms cubic-bezier(.22,.75,.35,1)';
    r.strip.style.transform = 'translateY(' + (-endPos) + 'px)';
  }, delay + t1);
  setTimeout(function () {
    r.el.classList.add('lit');
    setTimeout(function () { r.el.classList.remove('lit'); }, 320);
  }, delay + duration);
  r.cur = target;
}

function rebuildRemaining() {
  remaining = [];
  if (!noRepeat) return;
  for (let n = rangeStart; n <= rangeEnd; n++) {
    if (!drawn.has(n)) remaining.push(n);
  }
}

function pickNumber() {
  if (!noRepeat) return randInt(rangeStart, rangeEnd);
  const idx = randInt(0, remaining.length - 1);
  const n = remaining[idx];
  remaining.splice(idx, 1);
  return n;
}

function showResult(n) {
  drawn.add(n);
  historyList.unshift(n);
  resultBar.textContent = '本次中奖：' + pad3(n);
  resultBar.classList.add('win');
  renderHistory();
  updatePoolInfo();
}

function draw() {
  if (spinning) return;
  if (noRepeat && remaining.length === 0) {
    showToast('编号已全部抽完，请点击「重置记录」');
    return;
  }
  spinning = true;
  lever.classList.add('pulling');
  lever.classList.add('disabled');
  resultBar.classList.remove('win');
  resultBar.textContent = '转动中 · · ·';
  const n = pickNumber();
  const digits = pad3(n).split('').map(Number);
  digits.forEach(function (d, i) {
    spinReel(i, d, DURATIONS[i], DELAYS[i]);
  });
  const total = DELAYS[2] + DURATIONS[2] + 140;
  setTimeout(function () {
    spinning = false;
    lever.classList.remove('disabled');
    showResult(n);
  }, total);
}

function renderHistory() {
  chips.innerHTML = '';
  if (historyList.length === 0) {
    chips.innerHTML = '<span class="empty">暂无记录</span>';
  } else {
    historyList.slice(0, 30).forEach(function (n, i) {
      const b = document.createElement('button');
      b.className = 'chip' + (i === 0 ? ' latest' : '');
      b.textContent = pad3(n);
      b.title = '点击复制编号';
      b.addEventListener('click', function () { copyNum(n); });
      chips.appendChild(b);
    });
  }
  let countText = '已抽 ' + historyList.length + ' 次';
  if (noRepeat) countText += ' · 剩余 ' + remaining.length + ' 个';
  historyCount.textContent = countText;
}

function updatePoolInfo() {
  const total = rangeEnd - rangeStart + 1;
  let text = '编号池：' + rangeStart + ' ~ ' + rangeEnd + ' · 共 ' + total + ' 个编号';
  if (noRepeat) text += ' · 剩余 ' + remaining.length + ' 个可抽';
  poolInfo.textContent = text;
}

function applyRange() {
  const s = parseInt(startInput.value, 10);
  const e = parseInt(endInput.value, 10);
  const bad = function (v) { return isNaN(v) || v < 0 || v > 999; };
  startInput.classList.toggle('invalid', bad(s));
  endInput.classList.toggle('invalid', bad(e));
  if (bad(s) || bad(e)) {
    showToast('请输入 0 ~ 999 之间的编号');
    return;
  }
  if (s > e) {
    startInput.classList.add('invalid');
    endInput.classList.add('invalid');
    showToast('起始编号不能大于结束编号');
    return;
  }
  rangeStart = s;
  rangeEnd = e;
  drawn.clear();
  historyList.length = 0;
  rebuildRemaining();
  renderHistory();
  updatePoolInfo();
  showToast('编号范围已设为 ' + rangeStart + ' ~ ' + rangeEnd);
}

function copyNum(n) {
  const text = pad3(n);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      showToast('已复制 ' + text);
    }).catch(function () {
      showToast(text);
    });
  } else {
    showToast(text);
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
}

lever.addEventListener('click', draw);
leverArm.addEventListener('animationend', function () {
  lever.classList.remove('pulling');
});
document.addEventListener('keydown', function (ev) {
  if (ev.code !== 'Space' && ev.code !== 'Enter') return;
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'BUTTON') return;
  ev.preventDefault();
  draw();
});
startInput.addEventListener('change', applyRange);
endInput.addEventListener('change', applyRange);
startInput.addEventListener('input', function () { startInput.classList.remove('invalid'); });
endInput.addEventListener('input', function () { endInput.classList.remove('invalid'); });
noRepeatSwitch.addEventListener('click', function () {
  noRepeat = !noRepeat;
  noRepeatSwitch.setAttribute('aria-checked', String(noRepeat));
  rebuildRemaining();
  renderHistory();
  updatePoolInfo();
  showToast(noRepeat ? '已开启不重复抽取' : '已关闭不重复抽取');
});
resetBtn.addEventListener('click', function () {
  drawn.clear();
  historyList.length = 0;
  rebuildRemaining();
  renderHistory();
  updatePoolInfo();
  showToast('已重置开奖记录');
});
window.addEventListener('resize', function () {
  if (!spinning) reels.forEach(snapReel);
});

buildStrips();
reels.forEach(snapReel);
rebuildRemaining();
updatePoolInfo();
renderHistory();
</script>
</body>
</html>
